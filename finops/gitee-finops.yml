description: >-
  FinOps view of Gitee spend. Gitee's personal tier and its free Enterprise
  package carry no vendor invoice. Cost is incurred through paid Gitee
  Enterprise Edition packages (Standard / Premium), which are billed per seat
  per year in CNY - so the dominant cost driver is seat count times package
  price, not API call volume. The Open API v5 has no per-call fee; it is
  governed by rate limits rather than metered billing. Enterprise add-ons such
  as Gitee Go (CI/CD) may carry their own usage-based charges.
notes: >-
  Per-seat list prices and package contents are denominated in CNY and change;
  verify on the Gitee Enterprise pricing page. Gitee Go and other DevOps add-ons
  can introduce usage-based charges (for example build minutes) separate from
  seat licensing - reconcile those separately.
