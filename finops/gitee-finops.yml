meters:
- name: enterprise_seats
  description: Paid Gitee Enterprise Edition seats, billed per user per year.
  unit: seats
  aggregation: sum
  dimensions:
  - enterprise
  - package
- name: gitee_go_minutes
  description: Gitee Go CI/CD build minutes, where applicable, billed on usage.
  unit: minutes
  aggregation: sum
  dimensions:
  - enterprise
- name: storage
  description: Repository storage allowance consumed within an enterprise package.
  unit: bytes
  aggregation: max
  dimensions:
  - enterprise
principles:
- name: Visibility
  description: Track paid enterprise seat counts and any Gitee Go usage per enterprise and package tier.
- name: Allocation
  description: Map enterprise members and repositories to internal teams so seat spend and storage attribute to cost centers.
- name: Optimization
  description: Right-size the enterprise package to actual active seats; use the free personal tier for individual or open-source work; pool CI usage.
- name: Accountability
  description: Assign an owner per enterprise account; review seat renewals and Gitee Go usage against budget annually.
