aid: gitee
url: https://raw.githubusercontent.com/api-evangelist/gitee/refs/heads/main/apis.yml
name: Gitee
kind: company
description: >-
  Gitee (码云) is a major China-based Git hosting and DevOps platform operated by
  OSChina / Shenzhen Oschina (开源中国). It provides code hosting, pull requests,
  issue tracking, gists, organizations, and enterprise DevOps workflows for
  millions of developers and repositories. Gitee exposes a documented REST API
  v5 at https://gitee.com/api/v5 (live Swagger at
  https://gitee.com/api/v5/swagger) covering repositories, issues, pull
  requests, users, organizations, gists, enterprises, webhooks, and search.
  Requests authenticate with a personal access token (access_token query
  parameter or Authorization header) or via OAuth2. Gitee offers a free
  personal tier plus paid Enterprise editions.
